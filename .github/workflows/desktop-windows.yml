# Builds the Windows installer (desktop/). Run it by hand from the Actions tab, or push a tag like desktop-v0.1.0.
name: Desktop (Windows)
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install -g pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Install desktop tooling
        working-directory: desktop
        run: npm ci
      - name: Bundle and test the server
        working-directory: desktop
        run: |
          npm run bundle
          npm test
      - name: Build the installer
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: litpage-windows
          path: desktop/release/*.exe
          if-no-files-found: error
